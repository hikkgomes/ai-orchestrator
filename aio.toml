[orchestrator]
max_retries = 3
max_rework_loops = 3
max_replan_loops = 2
step_timeout = 300
planning_timeout = 120
execution_timeout_low = 180
execution_timeout_medium = 300
execution_timeout_high = 600
review_timeout = 180
adjudication_timeout = 120

[routing]
planner = "claude"
worker = "codex"
reviewer = "claude"
adjudicator = "claude"

[routing.claude]
model = ""
reasoning_effort = "high"

[routing.codex]
model = ""
reasoning_effort = "medium"

[approval]
require_plan_approval = true
require_merge_approval = true

[worktree]
base_branch = "main"
branch_prefix = "aio/"

[logging]
retain_raw_output = false
retain_prompts = false

[cli_compat]
claude_min_version = ""
codex_min_version = ""
