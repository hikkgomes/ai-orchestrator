[orchestrator]
max_retries = 3
max_rework_loops = 3
max_replan_loops = 2
watchdog_timeout = 3600

[routing]
planner = "claude"
worker = "codex"
reviewer = "claude"
adjudicator = "codex"
feasibility_checker = "codex"
scoper = "claude"

[routing.claude]
model = ""
reasoning_effort = "high"

[routing.codex]
model = ""
reasoning_effort = "medium"

[routing.phases.scoping]
reasoning_effort = "high"

[routing.phases.planning]
reasoning_effort = "medium"

[routing.phases.feasibility]
reasoning_effort = "medium"

[routing.phases.reviewing]
reasoning_effort = "high"

[routing.phases.adjudicating]
reasoning_effort = "medium"

[scoping]
enabled = true

[feasibility]
enabled = true

[approval]
require_plan_approval = true
require_merge_approval = true

[worktree]
base_branch = "main"
branch_prefix = "aio/"

# Uncomment for multi-repo workspace mode:
# [workspace]
# repos = ["frontend", "backend"]

[logging]
retain_raw_output = false
retain_prompts = false

[cli_compat]
claude_min_version = ""
codex_min_version = ""
