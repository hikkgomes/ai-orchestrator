# Default workflow configuration for ai-orchestrator.
#
# This file is the authoritative workflow definition for phase structure and
# default phase-level settings. The engine loads this file at startup.
# aio.toml provides user-level overrides for supported settings.

name: default
description: >
  Full orchestrated run: plan → approve → execute → review → adjudicate → merge.

phases:
  planning:
    cli: claude
    approval_gate: plan
    retries: 3

  executing:
    cli: codex
    worktree: true
    retries: 3
    complexity_timeouts:
      low: 180
      medium: 300
      high: 600

  reviewing:
    cli: claude
    retries: 3

  adjudicating:
    cli: claude
    retries: 3
    loop_limits:
      rework: 3
      replan: 2

  merging:
    approval_gate: merge
    pre_checks:
      - clean_working_tree
      - base_commit_match
